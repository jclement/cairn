name: Deploy

# Every push to main is checked (lint + tests) and, if green, deployed to Cloudflare
# (remote D1 migrations, then `wrangler deploy`) — the same mise tasks used locally.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    # Only the maintainer's repository deploys; forks (including Deploy-button copies) skip it.
    if: github.repository == 'jclement/cairn'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run setup
      - run: mise run check

  deploy:
    needs: check
    runs-on: ubuntu-24.04
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run setup
      - name: Migrate D1 and deploy the Worker
        run: mise run deploy
      - name: Smoke test
        run: |
          set -e
          # The instance's URL is PUBLIC_URL in wrangler.jsonc, so a fork smoke-tests its own.
          URL=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { publicUrlOf } from "./scripts/lib/wrangler-config.mjs"; console.log(publicUrlOf(readFileSync("wrangler.jsonc", "utf8")))')
          for i in 1 2 3 4 5 6; do curl -fsS "$URL/health" && break; sleep 10; done
          curl -fsS -o /dev/null "$URL/.well-known/oauth-authorization-server"
          curl -fsS -o /dev/null "$URL/.well-known/oauth-protected-resource/mcp"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/mcp")" = 401
